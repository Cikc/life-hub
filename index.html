<style>
/* ============ 设计变量：暖米温馨、低饱和、护眼 ============ */
:root{
  --bg:#F6F1EA;          /* 主背景 暖米 */
  --surface:#FFFBF5;     /* 卡片底 */
  --sidebar:#EFE6D9;     /* 侧边栏 暖米偏深 */
  --sidebar-active:#E2D2BD;
  --accent:#C8896F;      /* 主色 暖陶土 */
  --accent-soft:#F0D9CC;
  --text:#4A4039;        /* 正文 暖深灰棕 */
  --muted:#8C7E72;       /* 次要文字 */
  --border:#E7DECF;      /* 描边 */
  --income:#5B8C5A;      /* 收入绿（国内习惯） */
  --expense:#C8615A;     /* 支出红（国内习惯） */
  --done:#5B8C5A;
  --overdue:#C8615A;
  --shadow:0 1px 3px rgba(120,90,60,.06),0 4px 16px rgba(120,90,60,.06);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  /* 苹果手机安全区 */
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* ============ 侧边栏（PC 与手机均为左侧固定） ============ */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:212px;
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:50;
  overflow-y:auto;overscroll-behavior:contain;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand .logo{font-size:26px;line-height:1}
.brand .title{font-size:16px;font-weight:700;color:var(--text)}
.brand .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:8px 8px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--text);
  font-size:14.5px;transition:background .15s,color .15s;
  margin-bottom:3px;user-select:none;
}
.nav-item .ico{font-size:19px;width:24px;text-align:center;flex:none}
.nav-item:hover{background:rgba(200,137,111,.10)}
.nav-item.active{background:var(--sidebar-active);color:var(--accent);font-weight:700}
.nav-item.active .ico{filter:saturate(1.2)}
.sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* ============ 主内容区 ============ */
.main{margin-left:212px;min-height:100vh}
.page{display:none;padding:20px 22px 40px;max-width:980px}
.page.active{display:block}
.page-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.page-head .h-ico{font-size:24px}
.page-head h1{font-size:20px;margin:0;font-weight:700}
.page-head .desc{font-size:12.5px;color:var(--muted);margin-left:auto}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .muted{color:var(--muted);font-size:12.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* 概览统计卡网格 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(120,90,60,.12)}
.stat .s-ico{font-size:22px}
.stat .s-num{font-size:22px;font-weight:700;margin:6px 0 2px}
.stat .s-label{font-size:12px;color:var(--muted)}

/* 今天要处理区 */
.today-box{border:1px solid var(--accent-soft);background:#FBEEE6;border-radius:var(--radius);
  padding:16px;margin-bottom:18px}
.today-box h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.today-item:last-child{border-bottom:none}
.today-item .dot{width:8px;height:8px;border-radius:50%;background:var(--overdue);flex:none}
.today-item.done .dot{background:var(--done)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.red{background:#F6E0DC;color:var(--expense)}
.tag.green{background:#E2EFE0;color:var(--income)}

/* ============ 表单 ============ */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:16px;background:#fff;color:var(--text);font-family:inherit}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .grow{flex:1;min-width:140px}
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-soft)}
.btn.sm{padding:6px 12px;font-size:12.5px;min-height:34px}
.btn.danger{background:#E0A39C;color:#fff}
.btn.block{width:100%}
.seg{display:inline-flex;background:#F0E9DC;border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-size:13px;
  cursor:pointer;color:var(--muted);min-height:38px}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:var(--shadow)}

/* ============ 列表项 ============ */
.list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;word-break:break-word}
.li-meta{font-size:12px;color:var(--muted);margin-top:2px}
.li-actions{display:flex;gap:6px;flex:none;align-items:center}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;background:#fff}
.chk.on{background:var(--done);border-color:var(--done);color:#fff}
.done-text{text-decoration:line-through;color:var(--muted)}
.amt{font-weight:700}
.amt.in{color:var(--income)}
.amt.out{color:var(--expense)}
.group-label{font-size:12.5px;color:var(--accent);font-weight:700;margin:14px 0 2px;
  display:flex;align-items:center;gap:6px}
.empty-hint{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}

/* 体重迷你柱状图（纯 CSS div，不用 SVG） */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;padding:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar{width:60%;background:linear-gradient(var(--accent),var(--accent-soft));border-radius:6px 6px 0 0;min-height:3px}
.bar-label{font-size:9px;color:var(--muted);white-space:nowrap}

/* 设置步骤 */
.steps{counter-reset:s}
.step{position:relative;padding:10px 0 10px 36px;border-bottom:1px solid var(--border)}
.step:last-child{border:none}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step b{color:var(--text)}

/* 头部页签 */
.page-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ============ 响应式：手机端保留左侧固定侧边栏（更窄、仅 emoji） ============ */
@media(max-width:768px){
  .sidebar{width:62px}
  .brand{padding:12px 0;justify-content:center;flex-direction:column;gap:4px}
  .brand .logo{font-size:22px}
  .brand .title{display:none}
  .brand .sub{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:10px 0;justify-content:center;text-align:center;font-size:10px}
  .nav-item .ico{font-size:20px;width:auto}
  .nav-item span:not(.ico){font-size:9px;line-height:1.1}
  .sidebar-foot{display:none}
  .main{margin-left:62px}
  .page{padding:16px 14px 60px}
  .page-head .desc{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .page-head h1{font-size:18px}
}
@media(max-width:380px){
  .stat-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* ============================================================
   个人生活工作台 · 单文件应用脚本
   数据全部存 localStorage，key 统一前缀 wb_lifehub_
   ============================================================ */
(function(){
"use strict";

var K = {
  notes:'wb_lifehub_notes', todos:'wb_lifehub_todos', accounting:'wb_lifehub_accounting',
  study:'wb_lifehub_study', favorites:'wb_lifehub_favorites', fitness:'wb_lifehub_fitness',
  picks:'wb_lifehub_picks', seeded:'wb_lifehub_seeded'
};
var VER = '1.0';

/* ---------- 工具 ---------- */
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayOffset(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowMonth(){return todayStr().slice(0,7);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){s=(s==null?'':String(s));return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function load(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
function fmt(n){return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});}

/* ---------- 预置示例数据（首次打开注入，真实感内容） ---------- */
function seed(){
  if(localStorage.getItem(K.seeded)==='1') return;
  var t=todayStr();
  save(K.notes,[
    {id:uid(),date:dayOffset(-3),content:'今天早起跑了5公里，江边空气清冽，整个人都清醒了。坚持真有回报。'},
    {id:uid(),date:dayOffset(-2),content:'重读《被讨厌的勇气》第三章，「课题分离」让我重新想了想和同事的边界。'},
    {id:uid(),date:dayOffset(-1),content:'试用 AI 帮忙润色了一份周报，效率至少提升一倍，表达也更顺了。'},
    {id:uid(),date:t,content:'菜场买了新鲜番茄和土鸡蛋，做了盘番茄炒蛋，比外卖好吃太多。'},
    {id:uid(),date:t,content:'学吉他弹唱《晴天》，Bm 和弦转换还得再练几百次。'},
    {id:uid(),date:t,content:'晚上散步抬头看到满月，想起小时候奶奶讲的嫦娥故事。'}
  ]);
  save(K.todos,[
    {id:uid(),text:'提交上周季度复盘报告',date:dayOffset(-2),done:false},   // 逾期
    {id:uid(),text:'给妈妈打个电话问候',date:t,done:false},                   // 今天
    {id:uid(),text:'整理本月记账凭证并归档',date:t,done:false},
    {id:uid(),text:'给阳台绿植浇水、施点肥',date:t,done:true},
    {id:uid(),text:'预约下周牙科年度检查',date:dayOffset(2),done:false},
    {id:uid(),text:'读完《深度工作》第五章并写卡片笔记',date:dayOffset(3),done:false},
    {id:uid(),text:'周末采购下周食材清单',date:dayOffset(6),done:false}
  ]);
  save(K.accounting,[
    {id:uid(),date:dayOffset(-9),type:'收入',amount:12000,category:'工资',app:'银行卡',hongbao:false,note:'上月工资到账'},
    {id:uid(),date:dayOffset(-7),type:'支出',amount:239,category:'餐饮',app:'美团',hongbao:false,note:'周末朋友聚餐'},
    {id:uid(),date:dayOffset(-6),type:'支出',amount:59.9,category:'日用',app:'淘宝',hongbao:false,note:'洗衣液+纸巾'},
    {id:uid(),date:dayOffset(-5),type:'收入',amount:88,category:'红包',app:'微信',hongbao:true,note:'朋友结婚回礼红包'},
    {id:uid(),date:dayOffset(-4),type:'支出',amount:6.5,category:'交通',app:'支付宝',hongbao:false,note:'地铁通勤'},
    {id:uid(),date:dayOffset(-3),type:'支出',amount:128,category:'餐饮',app:'美团',hongbao:false,note:'两顿外卖'},
    {id:uid(),date:dayOffset(-2),type:'收入',amount:200,category:'红包',app:'微信',hongbao:true,note:'长辈给的红包'},
    {id:uid(),date:dayOffset(-1),type:'支出',amount:35,category:'娱乐',app:'支付宝',hongbao:false,note:'视频会员续费'},
    {id:uid(),date:t,type:'支出',amount:18.8,category:'餐饮',app:'微信',hongbao:false,note:'早餐'}
  ]);
  save(K.study,[

/* ---------- 路由 ---------- */
var routes=['overview','todos','fitness','accounting','picks','notes','study','favorites','settings'];
function navigate(route){
  if(routes.indexOf(route)<0) route='overview';
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.toggle('active',pages[i].id==='page-'+route);
  var items=document.querySelectorAll('.nav-item');
  for(var j=0;j<items.length;j++) items[j].classList.toggle('active',items[j].dataset.route===route);
  render[route]();
  try{history.replaceState(null,'','#'+route);}catch(e){}
  var main=document.getElementById('main'); if(main) main.scrollTop=0;
}

render.overview=function(){
  var todos=D.todos(), acc=D.accounting(), fit=D.fitness();
  var today=todayStr();
  var overdue=[], todays=[];
  todos.forEach(function(t){

    if(t.date===today) todays.push(t);
  });
  var mo=nowMonth();
  var inc=0,exp=0;
  acc.forEach(function(a){if(a.date.slice(0,7)===mo){if(a.type==='收入')inc+=a.amount;else exp+=a.amount;}});
  // 本周运动（近7天非休息）
  var weekCount=0; fit.forEach(function(f){if(f.date>=dayOffset(-6)&&f.type!=='休息')weekCount++;});
  var latestW = fit.length? fit[fit.length-1].weight : '--';

  var h=head('🏠','首页','你的日常，一目了然');

  // 今天要处理
  var th='<div class="today-box"><h2>📌 今天要处理</h2>';
  var pend=overdue.concat(todays);

    pend.forEach(function(t){

    {ico:'💰',num:'¥'+fmt(inc-exp),label:'本月结余 收¥'+fmt(inc)+' 支¥'+fmt(exp),route:'accounting'},

/* 3. 待办 */
render.todos=function(){
  var list=D.todos();
  var today=todayStr();
  var ov=[],td=[],up=[];
  list.forEach(function(t){
    if(t.done) return;
    if(t.date<today) ov.push(t); else if(t.date===today) td.push(t); else up.push(t);
  });
  var done=list.filter(function(t){return t.done;});
  var h=head('📅','日程待办','每日计划，完成即划掉');
  var form='<div class="form-card"><div class="inline-form">'+
    '<div class="grow"><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">待办事项</label>'+
    '<input type="text" id="todo-text" placeholder="要做的事…" maxlength="60"></div>'+
    '<div><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">日期</label>'+
    '<input type="date" id="todo-date" value="'+today+'"></div>'+
    '<button class="btn" data-act="add-todo">＋ 添加</button></div></div>';

  function row(t,flag){
    var tag='';
    if(flag==='over') tag=' <span class="tag red">逾期</span>';
    if(flag==='today') tag=' <span class="tag green">今天</span>';
    return '<div class="list-item"><div class="chk'+(t.done?' on':'')+'" data-act="toggle-todo" data-id="'+t.id+'">'+(t.done?'✓':'')+'</div>'+
      '<div class="li-main"><div class="li-title'+(t.done?' done-text':'')+'">'+esc(t.text)+tag+'</div>'+
      '<div class="li-meta">📅 '+t.date+'</div></div>'+
      '<div class="li-actions"><button class="btn sm ghost" data-act="del-todo" data-id="'+t.id+'">删除</button></div></div>';
  }
  var body='';
  function group(title,arr,flag){
    if(!arr.length) return '';
    var s='<div class="group-label">'+title+'（'+arr.length+'）</div>';
    arr.forEach(function(t){s+=row(t,flag);});
    return s;
  }
  body+=group('🔴 逾期未完成',ov,'over');
  body+=group('⏰ 今天',td,'today');
  body+=group('📅 即将到期',up.sort(function(a,b){return a.date<b.date?-1:1;}),'');
  body+=group('✅ 已完成',done,'');
  if(!body) body='<div class="empty-hint">还没有待办，加一条吧 📅</div>';
  document.getElementById('page-todos').innerHTML=h+form+'<div class="card">'+body+'</div>';
};

render.accounting=function(){

    '<div><div class="muted" style="font-size:12px">本月收入</div><div class="amt in">+¥'+fmt(inc)+'</div></div>'+

    '</div></div>';

  // 分类统计维度
  var catExp={}, appExp={}, hbIn=0, hbOut=0;
  D.accounting().forEach(function(a){
    if(a.date.slice(0,7)!==mo) return;
    if(a.type==='支出'){
      catExp[a.category||'其他']=(catExp[a.category||'其他']||0)+a.amount;

    }
    if(a.hongbao){ if(a.type==='收入') hbIn+=a.amount; else hbOut+=a.amount; }
  });
  function bars(m){
    var keys=Object.keys(m).sort(function(a,b){return m[b]-m[a];});
    if(!keys.length) return '<div class="muted" style="font-size:12px">本月暂无支出记录</div>';
    var total=0; keys.forEach(function(k){total+=m[k];});
    var s='';

      var v=m[k]; var pct=total?Math.round(v/total*100):0;
      s+='<div style="margin:7px 0">'+
        '<div class="row-between"><span>'+esc(k)+'</span><span class="amt out">¥'+fmt(v)+' · '+pct+'%</span></div>'+
        '<div style="height:8px;background:var(--accent-soft);border-radius:6px;overflow:hidden;margin-top:3px">'+
        '<div style="height:100%;width:'+pct+'%;background:var(--accent)"></div></div></div>';
    });
    return s;
  }
  var statCard='<div class="card">'+
    '<div class="card-title">📊 本月分类统计</div>'+
    '<div class="group-label">💼 按消费类别（支出）</div>'+bars(catExp)+
    '<div class="group-label">📱 按消费 APP（支出）</div>'+bars(appExp)+
    '<div class="group-label">🧧 红包收支</div>'+
    '<div class="row-between"><span class="muted" style="font-size:12px">红包收入</span><span class="amt in">+¥'+fmt(hbIn)+'</span></div>'+
    '<div class="row-between"><span class="muted" style="font-size:12px">红包支出</span><span class="amt out">-¥'+fmt(hbOut)+'</span></div>'+
    '</div>';

  // 录入表单（新增：所属 APP、红包标记）
  var form='<div class="form-card"><div class="inline-form">'+
    '<div><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">类型</label>'+
    '<div class="seg" id="acc-seg"><button class="on" data-v="支出">💸 支出</button><button data-v="收入">💵 收入</button></div></div>'+
    '<div class="grow"><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">金额</label>'+
    '<input type="number" id="acc-amount" placeholder="0.00" step="0.01" inputmode="decimal"></div>'+
    '<div class="grow"><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">消费类别</label>'+
    '<input type="text" id="acc-cat" placeholder="餐饮/交通/工资…" maxlength="10"></div>'+
    '<div><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">所属 APP</label>'+
    '<select id="acc-app"><option>微信</option><option>支付宝</option><option>美团</option><option>淘宝</option><option>银行卡</option><option>现金</option><option>其他</option></select></div>'+
    '<div><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">日期</label>'+
    '<input type="date" id="acc-date" value="'+today+'"></div>'+
    '<div class="grow"><label style="display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px">备注</label>'+
    '<input type="text" id="acc-note" placeholder="可填可不填" maxlength="30"></div>'+
    '<div style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-height:44px;cursor:pointer">'+
    '<input type="checkbox" id="acc-hb" style="width:18px;height:18px"> 🧧 红包</label></div>'+
    '<button class="btn" data-act="add-acc">＋ 记账</button></div></div>';

  var body='';
  if(!list.length) body='<div class="empty-hint">还没有记录，记第一笔吧 💰</div>';
  list.forEach(function(a){
    var cls=a.type==='收入'?'in':'out';
    var sign=a.type==='收入'?'+':'-';
    var tags='';
    if(a.app) tags+=' · <span class="tag">'+esc(a.app)+'</span>';

      '<button class="btn sm ghost" data-act="del-acc" data-id="'+a.id+'">删除</button></div>';
  });
  document.getElementById('page-accounting').innerHTML=h+sum+statCard+form+'<div class="card">'+body+'</div>';

var PICK_TABS=[
  {key:'headline',ico:'📰',name:'每日头条',feeds:['https://sspai.com/feed','https://www.ithome.com/rss/']},
  {key:'finance',ico:'💹',name:'财经',feeds:['https://36kr.com/feed','https://www.huxiu.com/rss/0.xml']},
  {key:'money',ico:'🏦',name:'金融',feeds:['https://www.huxiu.com/rss/0.xml','https://36kr.com/feed']},
  {key:'ai',ico:'🤖',name:'AI动向',feeds:['https://www.qbitai.com/feed','https://www.jiqizhixin.com/feed']}
];
var currentPickTab='headline';
function pickText(el,tag){var n=el.querySelector(tag);return n?n.textContent.trim():'';}
function pickStrip(s){if(!s)return '';var d=document.createElement('div');d.innerHTML=s;var t=(d.textContent||'').replace(/\s+/g,' ').trim();return t.length>90?t.slice(0,90)+'…':t;}
function fetchRSS(rssUrl){
  return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl))
    .then(function(r){if(!r.ok)throw new Error('http'+r.status);return r.text();})
    .then(function(xml){
      var doc=new DOMParser().parseFromString(xml,'text/xml');
      var items=doc.querySelectorAll('item, entry');
      var arr=[];
      for(var i=0;i<items.length && arr.length<12;i++){
        var it=items[i];
        var title=pickText(it,'title');
        var link=pickText(it,'link');
        if(!link && it.querySelector('link')) link=it.querySelector('link').getAttribute('href')||'';
        var desc=pickText(it,'description')||pickText(it,'summary')||pickText(it,'content')||'';
        arr.push({title:title,link:link,desc:pickStrip(desc)});
      }
      return arr;
    });
}
function loadPickFeed(tabKey){
  var tab=null;for(var i=0;i<PICK_TABS.length;i++){if(PICK_TABS[i].key===tabKey)tab=PICK_TABS[i];}
  var box=document.getElementById('pick-feed');if(!box||!tab)return;
  box.innerHTML='<div class="empty-hint">⏳ 正在获取「'+esc(tab.name)+'」资讯…</div>';
  var tried=0;
  function tryNext(){
    if(tried>=tab.feeds.length){box.innerHTML='<div class="empty-hint">⚠️ 无法获取资讯（网络受限或源不可用），请检查网络后重试。</div>';return;}
    var url=tab.feeds[tried++];
    fetchRSS(url).then(function(items){
      if(!items.length){tryNext();return;}
      var h='';
      items.forEach(function(it){
        var href=it.link?it.link:'#';
        h+='<a class="card" href="'+esc(href)+'" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit">'+
          '<div class="row-between"><div class="card-title">'+tab.ico+' '+esc(it.title||'无标题')+'</div><span class="muted">↗</span></div>'+
          (it.desc?'<div class="muted" style="margin-top:4px;font-size:12.5px">'+esc(it.desc)+'</div>':'')+'</a>';
      });
      box.innerHTML=h;
    }).catch(function(){tryNext();});
  }
  tryNext();
}

function addTrain(){var day=g('train-day').value;var date=g('train-date').value||todayStr();var names={'A':'推（胸肩三头）','B':'拉（背二头）','C':'腿（股四腘绳核心）'};var a=D.fitness();a.push({id:uid(),kind:'train',date:date,day:day,name:names[day],done:true});save(K.fitness,a);render.fitness();}
function delFit(id){var a=D.fitness().filter(function(f){return f.id!==id;});save(K.fitness,a);render.fitness();}
function addPick(){var ty=g('pick-type').value;var t=g('pick-title').value.trim();var n=g('pick-note').value.trim();var date=g('pick-date').value||todayStr();if(!t){g('pick-title').focus();return;}var a=D.picks();a.push({id:uid(),type:ty,title:t,note:n,date:date});save(K.picks,a);render.picks();}
function delPick(id){var a=D.picks().filter(function(p){return p.id!==id;});save(K.picks,a);render.picks();}

function exportJSON(){
  var data={version:VER,exportedAt:new Date().toISOString(),
    notes:D.notes(),todos:D.todos(),accounting:D.accounting(),study:D.study(),
    favorites:D.favorites(),fitness:D.fitness(),picks:D.picks()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='lifehub-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importJSON(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.notes)save(K.notes,d.notes);
      if(d.todos)save(K.todos,d.todos);
      if(d.accounting)save(K.accounting,d.accounting);
      if(d.study)save(K.study,d.study);
      if(d.favorites)save(K.favorites,d.favorites);
      if(d.fitness)save(K.fitness,d.fitness);
      if(d.picks)save(K.picks,d.picks);
      alert('✅ 导入成功！');
      navigate('settings');
    }catch(e){alert('❌ 文件解析失败，请选择正确的备份 JSON。');}
  };
  r.readAsText(file);
}
function clearAll(){
  if(!confirm('⚠️ 确认清空全部本地数据吗？\n此操作不可恢复，建议先导出备份。\n\n点击「确定」将删除随笔/待办/记账/学习/收藏/运动/精选全部数据。')) return;
  Object.keys(K).forEach(function(k){localStorage.removeItem(K[k]);});
  localStorage.removeItem(K.seeded);
  seed();
  alert('✅ 已清空并恢复示例数据。');
  navigate('overview');
}

function g(id){return document.getElementById(id);}

/* ---------- 事件委托 ---------- */
document.addEventListener('click',function(e){
  var pk=e.target.closest('[data-pick]');
  if(pk){currentPickTab=pk.dataset.pick;var pls=document.querySelectorAll('#pick-tabs .pill');for(var pi=0;pi<pls.length;pi++){pls[pi].classList.toggle('on',pls[pi].dataset.pick===currentPickTab);}loadPickFeed(currentPickTab);return;}
  var t=e.target.closest('[data-act],[data-go],[data-route]');
  if(!t) return;
  if(t.dataset.route){navigate(t.dataset.route);return;}
  if(t.dataset.go){navigate(t.dataset.go);return;}
  var act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case 'add-note':addNote();break;
    case 'del-note':delNote(id);break;
    case 'add-todo':addTodo();break;
    case 'del-todo':delTodo(id);break;
    case 'toggle-todo':toggleTodo(id);break;
    case 'add-acc':addAcc();break;
    case 'del-acc':delAcc(id);break;
    case 'add-study':addStudy();break;
    case 'del-study':delStudy(id);break;
    case 'add-fav':addFav();break;
    case 'del-fav':delFav(id);break;
    case 'add-weight':addWeight();break;
    case 'add-train':addTrain();break;
    case 'del-fit':delFit(id);break;
    case 'add-pick':addPick();break;
    case 'del-pick':delPick(id);break;
    case 'export':exportJSON();break;
    case 'import':g('import-file').click();break;
    case 'clear-all':clearAll();break;
  }
});
// 记账类型切换
document.addEventListener('click',function(e){
  var b=e.target.closest('#acc-seg button');
  if(!b) return;
  var btns=document.querySelectorAll('#acc-seg button');
  for(var ai=0;ai<btns.length;ai++){btns[ai].classList.remove('on');}
  b.classList.add('on'); accType=b.dataset.v;
});
// 文件导入
document.addEventListener('change',function(e){
  if(e.target.id==='import-file' && e.target.files[0]){importJSON(e.target.files[0]);}
});
// 侧边栏点击
document.getElementById('nav').addEventListener('click',function(e){
  var it=e.target.closest('.nav-item'); if(it) navigate(it.dataset.route);
});
// 回车快捷提交
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  var map={'todo-text':'add-todo','acc-amount':'add-acc','fav-url':'add-fav','pick-title':'add-pick','study-title':'add-study'};
  // 用 Ctrl/Cmd+Enter 提交，避免误触
  if(!(e.ctrlKey||e.metaKey)) return;
  for(var id in map){if(document.activeElement&&document.activeElement.id===id){e.preventDefault();var el=document.querySelector('[data-act="'+map[id]+'"]');if(el)el.click();}}
});

/* ---------- PWA：运行时注入 manifest + canvas emoji 图标 ---------- */
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeIcon(size,emoji){
  var c=document.createElement('canvas');c.width=c.height=size;
  var ctx=c.getContext('2d');
  var g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#F3DCC8');g.addColorStop(1,'#C8896F');
  ctx.fillStyle=g;roundRect(ctx,0,0,size,size,size*0.22);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(size*0.58)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(emoji,size/2,size/2+size*0.04);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    var manifest={name:'个人生活工作台',short_name:'生活台',start_url:'.',scope:'.',
      display:'standalone',orientation:'any',background_color:'#F6F1EA',theme_color:'#C8896F',
      description:'个人日常生活记录工作台',icons:[
        {src:makeIcon(192,'🐱'),sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:makeIcon(512,'🐱'),sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]};
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    var murl=URL.createObjectURL(blob);
    var link=document.createElement('link');link.rel='manifest';link.href=murl;
    document.head.appendChild(link);
    /* apple-touch-icon 已在 <head> 静态内联 HelloKitty 图标，此处不再重复注入，避免 iOS 抓取时被覆盖 */
    var fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=makeIcon(64,'🐱');
    document.head.appendChild(fav);
  }catch(e){}
  // service worker：仅 http/https 下尝试注册（文件协议不支持），blob 注册可能受限则静默失败
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    try{
      var swCode='self.addEventListener("install",function(e){self.skipWaiting();});'+
        'self.addEventListener("activate",function(e){self.clients.claim();});'+
        'self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});';
      var swBlob=new Blob([swCode],{type:'application/javascript'});
      var swURL=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(function(){/* 静默：单文件已自带离线能力 */});
    }catch(e){}
  }
}

/* ---------- 启动 ---------- */
seed();
setupPWA();
var initRoute=(location.hash||'').replace('#','');
navigate(routes.indexOf(initRoute)>=0?initRoute:'overview');

})();
