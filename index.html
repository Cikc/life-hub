<style>
/* ============ 设计变量：暖米温馨、低饱和、护眼 ============ */
:root{
  --bg:#F6F1EA;          /* 主背景 暖米 */
  --surface:#FFFBF5;     /* 卡片底 */
  --sidebar:#EFE6D9;     /* 侧边栏 暖米偏深 */
  --sidebar-active:#E2D2BD;
  --accent:#C8896F;      /* 主色 暖陶土 */
  --accent-soft:#F0D9CC;
  --text:#4A4039;        /* 正文 暖深灰棕 */
  --muted:#8C7E72;       /* 次要文字 */
  --border:#E7DECF;      /* 描边 */
  --income:#5B8C5A;      /* 收入绿（国内习惯） */
  --expense:#C8615A;     /* 支出红（国内习惯） */
  --done:#5B8C5A;
  --overdue:#C8615A;
  --shadow:0 1px 3px rgba(120,90,60,.06),0 4px 16px rgba(120,90,60,.06);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  /* 苹果手机安全区 */
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}

/* ============ 侧边栏（PC 与手机均为左侧固定） ============ */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:212px;
  background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:50;
  overflow-y:auto;overscroll-behavior:contain;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand .logo{font-size:26px;line-height:1}
.brand .title{font-size:16px;font-weight:700;color:var(--text)}
.brand .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:8px 8px;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--text);
  font-size:14.5px;transition:background .15s,color .15s;
  margin-bottom:3px;user-select:none;
}
.nav-item .ico{font-size:19px;width:24px;text-align:center;flex:none}
.nav-item:hover{background:rgba(200,137,111,.10)}
.nav-item.active{background:var(--sidebar-active);color:var(--accent);font-weight:700}
.nav-item.active .ico{filter:saturate(1.2)}
.sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* ============ 主内容区 ============ */
.main{margin-left:212px;min-height:100vh}
.page{display:none;padding:20px 22px 40px;max-width:980px}
.page.active{display:block}
.page-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.page-head .h-ico{font-size:24px}
.page-head h1{font-size:20px;margin:0;font-weight:700}
.page-head .desc{font-size:12.5px;color:var(--muted);margin-left:auto}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .muted{color:var(--muted);font-size:12.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* 概览统计卡网格 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(120,90,60,.12)}
.stat .s-ico{font-size:22px}
.stat .s-num{font-size:22px;font-weight:700;margin:6px 0 2px}
.stat .s-label{font-size:12px;color:var(--muted)}

/* 今天要处理区 */
.today-box{border:1px solid var(--accent-soft);background:#FBEEE6;border-radius:var(--radius);
  padding:16px;margin-bottom:18px}
.today-box h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.today-item:last-child{border-bottom:none}
.today-item .dot{width:8px;height:8px;border-radius:50%;background:var(--overdue);flex:none}
.today-item.done .dot{background:var(--done)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.red{background:#F6E0DC;color:var(--expense)}
.tag.green{background:#E2EFE0;color:var(--income)}

/* ============ 表单 ============ */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:16px;background:#fff;color:var(--text);font-family:inherit}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .grow{flex:1;min-width:140px}
.w-narrow{flex:0 0 auto;width:150px}
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent-soft)}
.btn.sm{padding:6px 12px;font-size:12.5px;min-height:34px}
.btn.danger{background:#E0A39C;color:#fff}
.btn.block{width:100%}
.seg{display:inline-flex;background:#F0E9DC;border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-size:13px;
  cursor:pointer;color:var(--muted);min-height:38px}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:var(--shadow)}

/* ============ 列表项 ============ */
.list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;word-break:break-word}
.li-meta{font-size:12px;color:var(--muted);margin-top:2px}
.li-actions{display:flex;gap:6px;flex:none;align-items:center}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;background:#fff}
.chk.on{background:var(--done);border-color:var(--done);color:#fff}
.done-text{text-decoration:line-through;color:var(--muted)}
.amt{font-weight:700}
.amt.in{color:var(--income)}
.amt.out{color:var(--expense)}
.group-label{font-size:12.5px;color:var(--accent);font-weight:700;margin:14px 0 2px;
  display:flex;align-items:center;gap:6px}
.empty-hint{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}

/* 体重迷你柱状图（纯 CSS div，不用 SVG） */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;padding:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar{width:60%;background:linear-gradient(var(--accent),var(--accent-soft));border-radius:6px 6px 0 0;min-height:3px}
.bar-label{font-size:9px;color:var(--muted);white-space:nowrap}

/* 设置步骤 */
.steps{counter-reset:s}
.step{position:relative;padding:10px 0 10px 36px;border-bottom:1px solid var(--border)}
.step:last-child{border:none}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step b{color:var(--text)}

/* 头部页签 */
.page-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:6px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ============ 响应式：手机端保留左侧固定侧边栏（更窄、仅 emoji） ============ */
@media(max-width:768px){
  .sidebar{width:62px}
  .brand{padding:12px 0;justify-content:center;flex-direction:column;gap:4px}
  .brand .logo{font-size:22px}
  .brand .title{display:none}
  .brand .sub{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:10px 0;justify-content:center;text-align:center;font-size:10px}
  .nav-item .ico{font-size:20px;width:auto}
  .nav-item span:not(.ico){font-size:9px;line-height:1.1}
  .sidebar-foot{display:none}
  .main{margin-left:62px}
  .page{padding:16px 14px 60px}
  .page-head .desc{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .page-head h1{font-size:18px}
  .w-narrow{width:108px}
  .w-narrow input{font-size:16px}
}
@media(max-width:380px){
  .stat-grid{grid-template-columns:1fr}
}

/* ============ 弹窗（同步 / 精选预览） ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(74,64,57,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  max-width:460px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(74,64,57,.25)}
.modal-head{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--border)}
.modal-head .m-title{font-weight:700;font-size:16px;flex:1}
.modal-body{padding:14px 16px}
.modal-foot{padding:10px 16px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.code-box{width:100%;min-height:84px;border:1px dashed var(--accent);border-radius:10px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;color:var(--text);
  background:#FBF4EC;word-break:break-all;resize:vertical}
.modal input[type=text]{margin-top:6px}
.sync-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync-dot.on{background:var(--income);box-shadow:0 0 0 3px rgba(91,140,90,.18)}
.sync-dot.wait{background:#E0A93C;box-shadow:0 0 0 3px rgba(224,169,60,.18)}
.log-line{font-size:12px;color:var(--muted);padding:3px 0;border-bottom:1px dashed var(--border)}
.pop-prev{max-height:60vh;overflow:auto;white-space:pre-wrap;line-height:1.7}
.pop-prev .pp-type{font-size:12px;color:var(--accent);font-weight:700}
.pop-prev .pp-title{font-size:18px;font-weight:700;margin:4px 0 8px}
.pop-prev .pp-meta{font-size:12px;color:var(--muted);margin-top:10px}

</style>
</head>

<script>
/* ============================================================
   个人生活工作台 · 单文件应用脚本
   数据全部存 localStorage，key 统一前缀 wb_lifehub_
   ============================================================ */
(function(){
"use strict";

var K = {
  notes:'wb_lifehub_notes', todos:'wb_lifehub_todos', accounting:'wb_lifehub_accounting',
  study:'wb_lifehub_study', favorites:'wb_lifehub_favorites', fitness:'wb_lifehub_fitness',
  picks:'wb_lifehub_picks', seeded:'wb_lifehub_seeded',
  tomb:'wb_lifehub_tomb'   // 跨设备同步墓碑：{bucket:{id:ts}} 记录已删除项，保证删除能双向传播
};
var BUCKETS=['notes','todos','accounting','study','favorites','fitness','picks'];
var K_TOMB=K.tomb;
var VER = '1.1';

/* ---------- 工具 ---------- */
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayOffset(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowMonth(){return todayStr().slice(0,7);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){s=(s==null?'':String(s));return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function load(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
  /* 同步钩子：若已建立 P2P 连接，数据一变更就自动推送给对端（防数据碎片化、统一数据源） */
  if(typeof Sync!=='undefined' && Sync && Sync.connected){ Sync.schedulePush(); }
}
function bucketOf(key){return key.replace('wb_lifehub_','');}

/* ---------- 同步墓碑：本地删除也记一笔，合并时据此传播删除 ---------- */
function getTomb(){return load(K_TOMB,{});}
function stampTomb(bucket,id){var t=getTomb();(t[bucket]=t[bucket]||{})[id]=Date.now();save(K_TOMB,t);}

/* ---------- 冲突合并：以「修改时间戳 _ts」为准，墓碑优先删除 ---------- */
function mergeBucket(local,remote,remoteTomb,localTomb){
  var byId={};
  local.forEach(function(r){ if(r&&r.id) byId[r.id]={rec:r,ts:r._ts||0}; });
  remote.forEach(function(r){ if(!r||!r.id) return; var ex=byId[r.id]; if(!ex||(r._ts||0)>ex.ts) byId[r.id]={rec:r,ts:r._ts||0}; });
  function maxTomb(id){ return Math.max(remoteTomb[id]||0, localTomb[id]||0); }
  var out=[];
  for(var id in byId){ var it=byId[id]; if(maxTomb(id) > it.ts) continue; out.push(it.rec); }
  return out;
}
function mergeTomb(a,b){
  var m={};
  [a,b].forEach(function(t){ if(!t) return; for(var k in t){ if(!m[k]||t[k]>m[k]) m[k]=t[k]; } });
  return m;
}
function fmt(n){return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});}

var routes=['overview','todos','fitness','accounting','picks','notes','study','favorites','settings'];
function navigate(route){
  if(routes.indexOf(route)<0) route='overview';
  currentRoute=route;
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.toggle('active',pages[i].id==='page-'+route);
  var items=document.querySelectorAll('.nav-item');
  for(var j=0;j<items.length;j++) items[j].classList.toggle('active',items[j].dataset.route===route);
  render[route]();
  try{history.replaceState(null,'','#'+route);}catch(e){}
  var main=document.getElementById('main'); if(main) main.scrollTop=0;
}

function importJSON(file){

      var d=JSON.parse(r.result);
      if(d.notes)save(K.notes,d.notes);
      if(d.todos)save(K.todos,d.todos);
      if(d.accounting)save(K.accounting,d.accounting);
      if(d.study)save(K.study,d.study);
      if(d.favorites)save(K.favorites,d.favorites);

  r.readAsText(file);
}

/* ---------- PWA：运行时注入 manifest + canvas emoji 图标 ---------- */
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeIcon(size,emoji){
  var c=document.createElement('canvas');c.width=c.height=size;
  var ctx=c.getContext('2d');
  var g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#F3DCC8');g.addColorStop(1,'#C8896F');
  ctx.fillStyle=g;roundRect(ctx,0,0,size,size,size*0.22);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(size*0.58)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(emoji,size/2,size/2+size*0.04);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    var manifest={name:'个人生活工作台',short_name:'生活台',start_url:'.',scope:'.',
      display:'standalone',orientation:'any',background_color:'#F6F1EA',theme_color:'#C8896F',
      description:'个人日常生活记录工作台',icons:[
        {src:makeIcon(192,'🐱'),sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:makeIcon(512,'🐱'),sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]};
    var blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    var murl=URL.createObjectURL(blob);
    var link=document.createElement('link');link.rel='manifest';link.href=murl;
    document.head.appendChild(link);
    /* apple-touch-icon 已在 <head> 静态内联 HelloKitty 图标，此处不再重复注入，避免 iOS 抓取时被覆盖 */
    var fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=makeIcon(64,'🐱');
    document.head.appendChild(fav);
  }catch(e){}
  // service worker：仅 http/https 下尝试注册（文件协议不支持），blob 注册可能受限则静默失败
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    try{
      var swCode='self.addEventListener("install",function(e){self.skipWaiting();});'+
        'self.addEventListener("activate",function(e){self.clients.claim();});'+
        'self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});';
      var swBlob=new Blob([swCode],{type:'application/javascript'});
      var swURL=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(function(){/* 静默：单文件已自带离线能力 */});
    }catch(e){}
  }
}

function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('已复制 ✅');}catch(e){alert('复制失败，请手动长按选择文本');}ta.remove();}
function copyText(txt){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){alert('已复制 ✅');},function(){fallbackCopy(txt);}); } else fallbackCopy(txt); }

/* ---------- WebRTC 点对点同步（无服务器，手动信令 + AES-GCM 加密） ----------
   工作流程：房主「创建房间」→ 生成会话密钥 + 邀请码 → 对端「加入房间」输入密钥+邀请码 → 生成应答码
   → 房主「完成连接」粘贴应答码 → 建立 DataChannel。之后任一端数据变更 → 自动双向合并（按 _ts 时间戳，墓碑传播删除）。
   不联网时各自本地保存；下次同时在线自动合并。JSON 导出/导入仍作为兜底备份保留。
   [SYNC-BACKEND-HOOK] 若未来接入后端信令服务器，仅需把 manual 信令替换为服务器中转，合并逻辑无需改动。 */
var Sync={
  pc:null,dc:null,role:null,connected:false,key:'',_timer:null,_applying:false,logs:[],
  ready:(function(){try{return typeof crypto!=='undefined'&&crypto.subtle&&typeof RTCPeerConnection!=='undefined'&&typeof TextEncoder!=='undefined';}catch(e){return false;}})(),
  log:function(m){this.logs.unshift('['+new Date().toLocaleTimeString('zh-CN')+'] '+m);if(this.logs.length>8)this.logs.pop();if(currentRoute==='settings'){try{render.settings();}catch(e){}}}
};
function randKey(){var s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var r='';for(var i=0;i<6;i++)r+=s.charAt(Math.floor(Math.random()*s.length));return r;}
function ab2str(buf){var b=new Uint8Array(buf);var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return s;}
function str2ab(s){var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b.buffer;}
function b64urlEncode(s){return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64urlDecode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s);}
function deriveKey(pass){
  return crypto.subtle.importKey('raw',str2ab(pass),'PBKDF2',false,['deriveKey']).then(function(bk){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('lifehub-sync-salt'),iterations:100000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  });
}
function aesEncrypt(obj,pass){
  return deriveKey(pass).then(function(k){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,str2ab(JSON.stringify(obj))).then(function(buf){
      return b64urlEncode(ab2str(iv)+'||'+ab2str(buf));
    });
  });
}
function aesDecrypt(code,pass){
  return deriveKey(pass).then(function(k){
    var raw=b64urlDecode(code);var idx=raw.indexOf('||');if(idx<0)throw new Error('邀请码格式错误');
    var iv=str2ab(raw.slice(0,idx));var data=str2ab(raw.slice(idx+2));
    return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(iv)},k,data).then(function(buf){return JSON.parse(ab2str(buf));});
  });
}
function setupDc(dc){
  Sync.dc=dc;
  dc.onopen=function(){Sync.connected=true;Sync.log('🔗 数据通道已连接，开始实时同步 ✅');Sync.doPush();Sync.log('已推送本地全量数据');if(currentRoute==='settings'){try{render.settings();}catch(e){}}};
  dc.onclose=function(){Sync.connected=false;Sync.log('连接已断开');if(currentRoute==='settings'){try{render.settings();}catch(e){}}};
  dc.onmessage=function(e){try{var p=JSON.parse(e.data);syncApply(p);}catch(err){Sync.log('收到无法解析的数据');}};
}
function waitIce(pc){
  return new Promise(function(resolve){
    if(pc.iceGatheringState==='complete'){resolve();return;}
    var done=false;function fin(){if(done)return;done=true;resolve();}
    pc.addEventListener('icegatheringstatechange',function(){if(pc.iceGatheringState==='complete')fin();});
    setTimeout(fin,3000);
  });
}
function syncSnapshot(){
  var data={};BUCKETS.forEach(function(b){data[b]=load(K[b],[]);});
  return {data:data,tomb:getTomb()};
}
function syncApply(payload){
  if(!payload||!payload.data)return;
  Sync._applying=true;
  var localTomb=getTomb();var remoteTomb=payload.tomb||{};var changed=false;
  BUCKETS.forEach(function(b){
    var key=K[b];
    var local=load(key,[]);var remote=payload.data[b]||[];
    var merged=mergeBucket(local,remote,remoteTomb[b]||{},localTomb[b]||{});
    var newTomb=mergeTomb(localTomb[b]||{},remoteTomb[b]||{});
    if(JSON.stringify(merged)!==JSON.stringify(local)){save(key,merged);changed=true;}
    if(Object.keys(newTomb).length&&JSON.stringify(newTomb)!==JSON.stringify(localTomb[b]||{})){localTomb[b]=newTomb;save(K_TOMB,localTomb);changed=true;}
  });
  Sync._applying=false;
  if(changed){try{render[currentRoute]();}catch(e){}Sync.log('已合并对端数据并刷新');}
}
Sync.schedulePush=function(){
  if(!this.connected||!this.dc)return;var self=this;
  if(this._timer)clearTimeout(this._timer);
  this._timer=setTimeout(function(){self.doPush();},400);
};
Sync.doPush=function(){
  if(!this.dc||this.dc.readyState!=='open')return;
  try{this.dc.send(JSON.stringify(syncSnapshot()));this.log('已推送本地变更');}catch(e){}
};
Sync.createRoom=function(){
  if(!Sync.ready){alert('当前浏览器不支持 WebRTC 同步（需在 https 或 localhost 下，或用较新版手机/电脑浏览器）。可继续用 JSON 导出/导入备份。');return;}
  try{
    Sync.role='host';Sync.key=randKey();
    var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    Sync.pc=pc;
    var dc=pc.createDataChannel('lifehub-sync');setupDc(dc);
    pc.createOffer().then(function(o){return pc.setLocalDescription(o);})
      .then(function(){return waitIce(pc);})
      .then(function(){return aesEncrypt({type:'offer',sdp:pc.localDescription},Sync.key);})
      .then(function(code){Sync.showInvite(code);Sync.log('房间已创建，等待对端加入…');})
      .catch(function(e){Sync.log('创建房间失败：'+(e&&e.message||e));});
  }catch(e){Sync.log('创建房间失败：'+(e&&e.message||e));}
};
Sync.joinRoom=function(key,offerCode){
  if(!Sync.ready){alert('当前浏览器不支持 WebRTC 同步。');return;}
  if(!key||!offerCode){alert('请填写会话密钥与邀请码');return;}
  try{
    Sync.role='guest';Sync.key=key;
    var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    Sync.pc=pc;
    pc.ondatachannel=function(e){setupDc(e.channel);};
    aesDecrypt(offerCode,key).then(function(obj){
      if(!obj||obj.type!=='offer')throw new Error('邀请码无效');
      return pc.setRemoteDescription(obj.sdp).then(function(){return pc.createAnswer();})
        .then(function(a){return pc.setLocalDescription(a);})
        .then(function(){return waitIce(pc);})
        .then(function(){return aesEncrypt({type:'answer',sdp:pc.localDescription},key);})
        .then(function(code){Sync.showAnswer(code);Sync.log('应答码已生成，发回房主完成连接');});
    }).catch(function(e){Sync.log('加入失败：'+(e&&e.message||e));alert('加入失败：'+(e&&e.message||e));});
  }catch(e){Sync.log('加入失败：'+(e&&e.message||e));alert('加入失败：'+(e&&e.message||e));}
};
Sync.complete=function(answerCode){
  if(!Sync.pc){alert('请先「创建房间」');return;}
  aesDecrypt(answerCode,Sync.key).then(function(obj){
    if(!obj||obj.type!=='answer')throw new Error('应答码无效');
    return Sync.pc.setRemoteDescription(obj.sdp);
  }).then(function(){Sync.log('已设置应答，等待通道连接…');closeModal();})
  .catch(function(e){Sync.log('完成连接失败：'+(e&&e.message||e));alert('完成连接失败：'+(e&&e.message||e));});
};
Sync.showInvite=function(code){
  showModal('🔄 邀请对端加入',
    '<p class="muted">把下面两样发给另一台设备（微信 / 邮件任意方式）：</p>'+
    '<div class="field"><label>① 会话密钥（对端加入时需输入）</label><div class="code-box" id="m-key" style="min-height:auto">'+esc(Sync.key)+'</div></div>'+
    '<div class="field"><label>② 邀请码（对端粘贴到「加入房间」）</label><textarea class="code-box" id="m-offer" readonly>'+esc(code)+'</textarea></div>'+
    '<div class="muted" style="font-size:12px">对端加入后会生成「应答码」，回到此处点「完成连接」粘贴即可建立同步。</div>',
    '<button class="btn ghost" data-act="copy" data-copy="m-key">复制密钥</button>'+
    '<button class="btn ghost" data-act="copy" data-copy="m-offer">复制邀请码</button>'+
    '<button class="btn" data-act="sync-complete-open">完成连接</button>');
};
Sync.showAnswer=function(code){
  showModal('🔑 应答码已生成',

    '<div class="muted" style="font-size:12px">房主在「完成连接」里粘贴此码后即建立同步，之后数据自动双向实时合并。</div>',
    '<button class="btn ghost" data-act="copy" data-copy="m-answer">复制应答码</button>'+
    '<button class="btn" data-act="modal-close">完成</button>');
};
